[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eberroy-annotate_jd187"
version = "0.1.0"
description = "解析时间标记，排列标注平台与数据质量工程师·工具调用的参数错配的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eberroy" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eberroy.github.io"
Repository = "https://github.com/eberroy/annotate_jd187"
Issues = "https://github.com/eberroy/annotate_jd187/issues"

[project.scripts]
annotate_jd187 = "annotate_jd187:main"

[tool.setuptools]
py-modules = ["annotate_jd187"]
